<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding | IA Minimalista</title>
    <style>
        /* =========================================
           VARIABLES DE COLOR
        ========================================= */
        :root {
            --bg-color: #050508; /* Fondo casi negro */
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --grad-start: #9d4edd; /* Morado */
            --grad-end: #00b4d8;   /* Azul claro */
        }

        /* =========================================
           RESETEO Y ESTILOS BASE
        ========================================= */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Evita barras de desplazamiento */
            position: relative;
        }

        /* =========================================
           EFECTO DE LUZ SIGUIENDO EL RATÓN
        ========================================= */
        .cursor-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.15) 0%, rgba(0, 180, 216, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none; /* Para que no interfiera con los clics */
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        /* =========================================
           TARJETA GLASSMORPHISM (Efecto Cristal)
        ========================================= */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 450px;
            width: 90%;
            z-index: 2; /* Para que esté por encima de la luz */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* =========================================
           TEXTOS CON DEGRADADO
        ========================================= */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            /* Degradado de morado a azul */
            background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* =========================================
           BOTÓN ESTILO NEÓN/MINIMALISTA
        ========================================= */
        button {
            background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.2);
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Halo de luz que seguirá el ratón -->
    <div class="cursor-glow" id="glow"></div>

    <!-- Contenedor principal con efecto de cristal -->
    <div class="glass-card">
        <h1>Vibe Coding</h1>
        <p>Tú pones la intuición y la creatividad. La inteligencia artificial escribe el código.</p>
        <button id="vibe-btn">Siente la vibra</button>
    </div>

    <script>
        // =========================================
        // JAVASCRIPT: Interactividad
        // =========================================
        
        // 1. Efecto del halo de luz siguiendo el ratón
        const glow = document.getElementById('glow');
        
        document.addEventListener('mousemove', (event) => {
            // Actualizamos la posición del div '.cursor-glow' a las coordenadas del ratón
            glow.style.left = event.clientX + 'px';
            glow.style.top = event.clientY + 'px';
        });

        // 2. Interacción con el botón
        const btn = document.getElementById('vibe-btn');
        
        btn.addEventListener('click', () => {
            // Cambiamos el texto y los colores temporalmente al hacer clic
            const originalText = btn.textContent;
            btn.textContent = '¡Código generado! ✨';
            btn.style.background = 'linear-gradient(90deg, #00b4d8, #9d4edd)'; // Invertimos el degradado
            
            // Regresamos a la normalidad después de 2.5 segundos
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = ''; // Vuelve al estilo del CSS
            }, 2500);
        });
    </script>

</body>
</html>
